name: tag-publish

# T302：只保留 tag push 与手动触发两条发布路径。
# 原 `release: published` 触发会在 tag push 流程 `gh release create` 后二次运行、
# 二次 publish 必然版本冲突失败（每次发版留一个红叉），已移除。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish version without leading v (optional; defaults to package.json when manually dispatched)'
        required: false
        type: string

# T302：id-token 未使用（发布走 NPM_TOKEN），移除以缩小凭据面
permissions:
  contents: write

concurrency:
  group: npm-publish-${{ github.ref_name || github.event.inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide npm publish
        id: npm_gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret is missing; skipping publish."
          fi

      - name: Validate version input
        if: ${{ steps.npm_gate.outputs.publish == 'true' && github.event.inputs.version != '' }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${{ github.event.inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::version 输入需为合法 semver（不含前导 v），收到: ${{ github.event.inputs.version }}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Resolve target version
        id: version
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          input_version="${{ github.event.inputs.version }}"
          if [ -n "$input_version" ]; then
            echo "target=$input_version" >> "$GITHUB_OUTPUT"
          else
            echo "target=$current_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      # T302：typecheck/test/build 无条件执行——release 只依赖质量门禁，
      # 与 npm publish 解耦；npm 发布是可选环节（见 NPM_TOKEN gate）。
      - name: Typecheck & Test
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Configure npm auth
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$HOME/.npmrc"

      - name: Publish to npm
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # --ignore-scripts：typecheck/test/build 已在上方步骤显式执行过，
          # 跳过 prepublishOnly 避免重复跑（本地 npm publish 仍会走 prepublishOnly 门禁）
          target="${{ steps.version.outputs.target }}"
          npm version --no-git-tag-version "$target"
          npm publish --access public --ignore-scripts

      - name: Create GitHub Release (tag push only)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag
